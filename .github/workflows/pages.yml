# The landing page (PLAN-018): publishes apps/site/public to GitHub Pages as is, with no build step.
# Manual only: nothing deploys until someone runs it from the Actions tab (docs/publishing.md §6).
name: Website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the landing page
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/public
      - id: deployment
        uses: actions/deploy-pages@v4
