<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0D0F" media="(prefers-color-scheme: dark)" />
    <!-- Brand icons (PLAN-017 S1): Vite hashes them into assets/, which the offline cache keeps. -->
    <link rel="icon" href="/src/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/src/brand/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/src/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/src/brand/manifest.webmanifest" />
    <title>Surface</title>
    <!-- Theme bootstrap: THEME_BOOTSTRAP_SCRIPT in @surface/ui. Keep it the only inline script (CSP hash). -->
    <script>
      (function () {
        var preference = null;
        try {
          preference = window.localStorage.getItem('surface.theme');
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
